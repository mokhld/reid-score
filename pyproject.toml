[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reid-score"
version = "0.1.0"
description = "Re-identification risk scoring for anonymized free text"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "reid-score contributors" }]
keywords = ["privacy", "anonymization", "gdpr", "hipaa", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/mokhld/reid-score"
Repository = "https://github.com/mokhld/reid-score"
Issues = "https://github.com/mokhld/reid-score/issues"

[project.scripts]
reid-score = "reid_score.cli:main"
reid-rat-bench = "reid_score.rat_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reid_score = ["data/us/*.sqlite", "data/gb/*.sqlite", "data/README.md"]
